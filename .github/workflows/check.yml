name: チェック

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

jobs:
  check:
    name: テスト・型チェック（make check、Ubuntu 24.04）
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係をインストール
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: チェックを実行
        run: make check

  build-deb:
    name: .deb のビルド確認（Ubuntu 24.04）
    runs-on: ubuntu-24.04
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係をインストール
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: ビルド依存をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev

      - name: debian/rules に実行権限を付ける
        run: chmod +x debian/rules

      - name: .deb パッケージをビルド
        run: dpkg-buildpackage -us -uc -b

      - name: パッケージの中身を確認
        run: |
          deb=$(ls ../cockpit-speedtest_*_all.deb)
          echo "ビルド成果物: $deb"
          dpkg-deb -I "$deb"
          # Cockpit 拡張のファイルが正しい場所に入っているか確認する
          for f in manifest.json index.html index.js index.css; do
            dpkg-deb -c "$deb" | grep -q "usr/share/cockpit/speedtest/$f" \
              || { echo "不足しているファイル: $f"; exit 1; }
          done
          echo "パッケージの中身は OK です"

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-speedtest-deb-check
          path: ../cockpit-speedtest_*_all.deb
